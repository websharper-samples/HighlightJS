<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>highlight.js · WebSharper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github.min.css" />
  <link rel="stylesheet" type="text/css" href="css/index.css" />
  <script type="text/javascript" src="Scripts/HighlightJS.head.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-logo"><i class="fa-solid fa-code"></i></span>
        <div class="app-titles">
          <h1>highlight.js</h1>
          <p>Syntax highlighting with <a href="https://websharper.com" target="_blank" rel="noreferrer">WebSharper</a></p>
        </div>
      </div>
      <a class="btn btn-ghost" href="https://github.com/websharper-samples/HighlightJS" target="_blank" rel="noreferrer">
        <i class="fa-brands fa-github"></i><span>Source</span>
      </a>
    </header>

    <main class="content">
      <section class="card">
        <div class="card-head">
          <h2>Source</h2>
          <p>Pick a language and edit the snippet — it is highlighted as you type.</p>
        </div>
        <div class="card-body">
          <div class="lang-bar" ws-hole="Languages"></div>
          <div class="editor-wrap">
            <textarea class="code-input" ws-var="Source" spellcheck="false" rows="16"></textarea>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Highlighted</h2>
          <p>Rendered by highlight.js.</p>
        </div>
        <div class="card-body">
          <pre class="code-block" ws-hole="Highlighted"></pre>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="Scripts/HighlightJS.min.js"></script>
</body>
</html>
